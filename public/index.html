<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Cookie 宠物机器人</title>

  <link rel="icon" href="favicon-new.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 1rem;
    }
    h1 { text-align: center; }

    .status-bar {
      margin: 0.5rem 0;
      font-size: 0.9rem;
      color: #666;
      text-align: center;
    }

    .chat-box {
      border: 1px solid #ccc;
      padding: 10px;
      height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 80%;
    }

    .message.bot {
      flex-direction: row;
      justify-content: flex-start;
    }

    .message.user {
      flex-direction: row;           
      justify-content: flex-end;     
      align-self: flex-end;          
    }
    .message.user .avatar { margin-left: 8px; }
    .message.user .bubble { text-align: right; }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .bubble {
      padding: 8px 12px;
      border-radius: 15px;
      background-color: #f1f1f1;
      word-wrap: break-word;
    }

    .message.bot .bubble {
      background-color: #f3ddc4; 
      text-align: left;
    }

    .message.user .bubble {
      background-color: #eed4d4; 
      text-align: right;
    }

    .input-area {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
    }

    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>🐾 Cookie 🐾</h1>
  <!-- 状态栏 -->
  <div class="status-bar" id="status">心情: 😊 | 饥饿: 50% | 清洁: 80%</div>

  <!-- 聊天区 -->
  <div class="chat-box" id="chat"></div>

  <!-- 输入区 -->
  <div class="input-area">
    <input id="msg" placeholder="输入消息..." />
    <button onclick="sendMsg()">发送</button>
  </div>

  <script>
    // ✅ 直接用 Vercel 部署的 Serverless Function
    const BACKEND_URL = '/api/chat';

    async function sendMsg() {
      const chat = document.getElementById('chat');
      const msgInput = document.getElementById('msg');
      const msg = msgInput.value.trim();
      if (!msg) return;

      // 插入用户消息
      chat.innerHTML += `
        <div class="message user">
          <div class="bubble">${msg}</div>
          <img class="avatar" src="user.png" alt="User">
        </div>`;
      msgInput.value = '';
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });
        if (!res.ok) throw new Error('网络错误 ' + res.status);
        const data = await res.json();

        // 插入Cookie回复
        chat.innerHTML += `
          <div class="message bot">
            <img class="avatar" src="cookie.png" alt="Cookie">
            <div class="bubble">${data.reply}</div>
          </div>`;
        chat.scrollTop = chat.scrollHeight;

        // 更新状态栏
        if (data.pet_state) {
          const ps = data.pet_state;
          document.getElementById('status').innerText =
            `心情: ${ps.mood} | 饥饿: ${(ps.hunger*100).toFixed(0)}% | 清洁: ${(ps.cleanliness*100).toFixed(0)}%`;
        }
      } catch (e) {
        chat.innerHTML += `<div class="message bot"><div class="bubble" style="color:red;">[错误] ${e}</div></div>`;
      }
    }
  </script>
</body>
</html>
